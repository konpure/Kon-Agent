# Alertmanager 配置：告警分组 / 路由 / 抑制
#
# 通知链路目标：vmalert(规则) → Alertmanager(路由/静默) → webhook(钉钉/飞书/邮件)
# 当前 receiver 为占位 webhook（指向本机 5001，无服务时 AM 仅记录发送失败日志，不影响运行）。
# 接入真实通知时替换 receivers 段：
#   - 钉钉：可用 timonwong/prometheus-webhook-dingtalk 桥接，url 指向桥接件
#   - 飞书：可用飞书自定义机器人 webhook 桥接件
#   - 邮件：直接用 email_configs（需 SMTP）

global:
  resolve_timeout: 5m

route:
  receiver: webhook-placeholder
  # 按告警名 + 采集端分组：同一台边缘设备的同类告警聚合为一条通知
  group_by: ["alertname", "agent_id"]
  group_wait: 30s        # 新告警组首条告警等待 30s，聚合同伴
  group_interval: 5m     # 组内新增告警后，距上次通知至少 5m 再发
  repeat_interval: 4h    # 同一未恢复告警的重复提醒间隔
  routes:
    - matchers:
        - severity = "critical"
      receiver: webhook-placeholder
      repeat_interval: 1h  # critical 更频繁提醒

receivers:
  - name: webhook-placeholder
    webhook_configs:
      # TODO: 替换为实际通知端点（钉钉/飞书桥接件或自有 webhook 服务）
      - url: "http://127.0.0.1:5001/"
        send_resolved: true

# 抑制规则：同设备同名告警触发 critical 后，屏蔽其 warning，避免重复通知
inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "agent_id"]
