# Grafana 数据源 provisioning：VictoriaMetrics
# VM 兼容 Prometheus HTTP API（/api/v1/query 等），用 prometheus 类型数据源即可。
apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics # 固定 uid，仪表盘 JSON 中按 uid 引用
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s # 采集端上报周期 5s
