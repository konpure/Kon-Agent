apiVersion: v1
kind: Service
metadata:
  name: {{ include "kon-agent-stack.componentName" (dict "context" $ "component" "victoria-metrics") }}
  labels:
    {{- include "kon-agent-stack.componentLabels" (dict "context" $ "component" "victoria-metrics") | nindent 4 }}
spec:
  type: {{ .Values.victoriaMetrics.service.type }}
  ports:
    - name: http
      port: {{ .Values.victoriaMetrics.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kon-agent-stack.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: victoria-metrics
