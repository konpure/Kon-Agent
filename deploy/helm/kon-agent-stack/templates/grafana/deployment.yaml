apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kon-agent-stack.componentName" (dict "context" $ "component" "grafana") }}
  labels:
    {{- include "kon-agent-stack.componentLabels" (dict "context" $ "component" "grafana") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kon-agent-stack.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "kon-agent-stack.componentLabels" (dict "context" $ "component" "grafana") | nindent 8 }}
    spec:
      {{- include "kon-agent-stack.pullSecrets" (dict "context" $) | nindent 6 }}
      containers:
        - name: grafana
          image: {{ include "kon-agent-stack.image" (dict "values" .Values.grafana "context" $) }}
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "kon-agent-stack.grafanaAdminSecretName" . }}
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kon-agent-stack.grafanaAdminSecretName" . }}
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: {{ .Values.grafana.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            {{- if .Values.grafana.storage.enabled }}
            - name: data
              mountPath: /var/lib/grafana
            {{- end }}
      volumes:
        - name: provisioning-datasources
          configMap:
            name: {{ include "kon-agent-stack.componentName" (dict "context" $ "component" "grafana") }}-datasources
        - name: provisioning-dashboards
          configMap:
            name: {{ include "kon-agent-stack.componentName" (dict "context" $ "component" "grafana") }}-dashboards-provider
        - name: dashboards
          configMap:
            name: {{ include "kon-agent-stack.componentName" (dict "context" $ "component" "grafana") }}-dashboards
        {{- if .Values.grafana.storage.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kon-agent-stack.fullname" . }}-grafana
        {{- end }}
