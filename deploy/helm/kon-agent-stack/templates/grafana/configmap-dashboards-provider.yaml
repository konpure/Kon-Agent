apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kon-agent-stack.componentName" (dict "context" $ "component" "grafana") }}-dashboards-provider
  labels:
    {{- include "kon-agent-stack.componentLabels" (dict "context" $ "component" "grafana") | nindent 4 }}
data:
  dashboards.yml: |-
    apiVersion: 1

    providers:
      - name: kon-agent
        orgId: 1
        folder: "Kon-Agent"
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
