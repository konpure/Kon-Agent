server: "quic://localhost:7843"
client-id: "edge-agent-1"
plugins:
  cpu:
    enable: true
    period: 5s
  memory:
    enable: true
    period: 5s
  disk:
    enable: true
    period: 5s
  ebpf:
    enable: true
    period: 5s
cache:
  path: /tmp/edge_agent.cache
  max_size: 50MB
wal:
  enable: true
  dir: /tmp/edge_agent.cache/wal
  segment_size: 16MB
  max_size: 128MB
  fsync_interval: 1s