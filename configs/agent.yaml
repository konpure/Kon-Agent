server: "quic://localhost:7843"
client-id: "edge-agent-1"
codec: gorilla
plugins:
  cpu:
    enable: true
    period: 5s
  memory:
    enable: true
    period: 5s
  disk:
    enable: true
    period: 5s
  ebpf:
    enable: true
    period: 5s
cache:
  path: /tmp/edge_agent.cache
  max_size: 50MB
wal:
  enable: true
  dir: /tmp/edge_agent.cache/wal
  segment_size: 16MB
  max_size: 128MB
  fsync_interval: 1s
sampling:
  mode: auto            # off | auto | always
  summary_window: 1m    # always 模式下的聚合窗口
  degraded_window: 30s  # WAL 背压时的降级粒度