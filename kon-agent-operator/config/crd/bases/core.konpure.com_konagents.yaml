---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: konagents.core.konpure.com
spec:
  group: core.konpure.com
  names:
    kind: KonAgent
    listKind: KonAgentList
    plural: konagents
    singular: konagent
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KonAgent is the Schema for the konagents API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KonAgentSpec defines the desired state of KonAgent
            properties:
              cache:
                description: Cache configuration
                properties:
                  maxSize:
                    description: MaxSize defines the maximum size of the cache
                    type: string
                  path:
                    description: Path where the cache file is stored
                    type: string
                type: object
              clientId:
                type: string
              codec:
                description: |-
                  Codec selects the wire encoding: gorilla | snappy | raw
                  (defaults to gorilla on the agent).
                type: string
              image:
                description: Image is the agent container image; defaults to konpure/kon-agent:latest.
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector limits the nodes the agent DaemonSet schedules onto,
                  e.g. {"node-role.kubernetes.io/edge": "true"}.
                type: object
              plugins:
                additionalProperties:
                  description: PluginConfig defines the configuration for a specific
                    plugin
                  properties:
                    enable:
                      description: Enable determines whether the plugin is enabled
                      type: boolean
                    period:
                      description: |-
                        Period defines how often the plugin should run, e.g. "5s".
                        A string is used instead of time.Duration because the CRD schema
                        serializes Duration as raw nanoseconds, which is unreadable in a CR.
                      type: string
                    pluginType:
                      description: PluginType specifies the type of the plugin
                      type: string
                  required:
                  - enable
                  - period
                  type: object
                description: add plugins config
                type: object
              sampling:
                description: Sampling configures downsampling; mirrors the agent's
                  sampling section.
                properties:
                  degradedWindow:
                    description: DegradedWindow under WAL backpressure, e.g. "30s"
                    type: string
                  mode:
                    description: 'Mode: off | auto (degrade on WAL backpressure) |
                      always (weak-network summary)'
                    type: string
                  summaryWindow:
                    description: SummaryWindow for mode=always, e.g. "1m"
                    type: string
                type: object
              server:
                description: |-
                  Server is the ingest endpoint the agent reports to, e.g. "quic://vm:7843".
                  Without it the generated agent.yaml has nowhere to connect.
                type: string
              tolerations:
                description: |-
                  Tolerations lets the agent pods schedule onto tainted nodes
                  (e.g. dedicated edge nodes).
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists and Equal. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
              wal:
                description: WAL configures the write-ahead log; mirrors the agent's
                  wal section.
                properties:
                  dir:
                    description: Dir stores the WAL segments; defaults to <cache path>/wal
                    type: string
                  enable:
                    description: Enable toggles the WAL (durable queue between pipeline
                      and exporter)
                    type: boolean
                  fsyncInterval:
                    description: FsyncInterval between fsyncs, e.g. "1s"
                    type: string
                  maxSize:
                    description: MaxSize caps total WAL disk usage, e.g. "128MB"
                    type: string
                  segmentSize:
                    description: SegmentSize per WAL segment file, e.g. "16MB"
                    type: string
                required:
                - enable
                type: object
            required:
            - clientId
            - plugins
            - server
            type: object
          status:
            description: KonAgentStatus defines the observed state of KonAgent
            properties:
              activePlugins:
                description: ActivePlugins lists the plugins currently running
                items:
                  type: string
                type: array
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastHeartbeatTime:
                description: LastHeartbeatTime is the last time the agent sent a heartbeat
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  for this resource by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
